# Pushing a tag v<version> (matching src/common.h) builds vrupscale and publishes it as a GitHub
# release: the zip the app's updater downloads (stored uncompressed), its SHA-256, and the source.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Check the tag against the version
        id: ver
        run: |
          VER=$(sed -n 's/^#define VU_VERSION_STR "\(.*\)"/\1/p' src/common.h)
          if [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VU_VERSION_STR $VER in src/common.h"
            exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: sh tools/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          python3 tools/release_notes.py "$VER" > notes.md
          cat build/vrupscale-$VER.zip.sha256
          gh release create "$GITHUB_REF_NAME" --title "vrupscale $VER" --notes-file notes.md \
            "build/vrupscale-$VER.zip" "build/vrupscale-$VER.zip.sha256" "build/vrupscale-$VER-src.zip"
