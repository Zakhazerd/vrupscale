# Publishes a GitHub release for each new version: when main gets a VU_VERSION_STR (src/common.h)
# that has no release yet, this builds vrupscale and creates release v<version> at that commit,
# with the zip the app's updater downloads (stored uncompressed). GitHub publishes each asset's
# SHA-256, which the updater checks; GitHub's own source archives come with the release.
# The notes are the version's section of CHANGELOG.md. (Pushing a tag v<version>
# works too; a version that already has a release is skipped.)
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version, and whether it is released already
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^#define VU_VERSION_STR "\(.*\)"/\1/p' src/common.h)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VU_VERSION_STR $VER in src/common.h"
            exit 1
          fi
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VER is released already; nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Install MinGW-w64
        if: steps.ver.outputs.skip != '1'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Build and package
        if: steps.ver.outputs.skip != '1'
        run: sh tools/package.sh

      - name: Publish the release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          python3 tools/release_notes.py "$VER" > notes.md
          sha256sum "build/vrupscale-$VER.zip" build/pkg/vrupscale-$VER/vrupscale.exe build/pkg/vrupscale-$VER/payload/dxgi.dll
          gh release create "v$VER" --target "$GITHUB_SHA" --title "vrupscale $VER" --notes-file notes.md \
            "build/vrupscale-$VER.zip"
